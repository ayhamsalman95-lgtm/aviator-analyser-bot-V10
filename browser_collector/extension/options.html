<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aviator Browser Collector</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    label { display:block; margin:16px 0 6px; font-weight:600; }
    input { width:100%; box-sizing:border-box; padding:10px; }
    button { margin-top:18px; padding:10px 16px; }
    #status { margin-top:14px; }
  </style>
</head>
<body>
  <h1>Aviator Browser Collector</h1>
  <p>Configure the ingest endpoint and collector token. Never enter your 1xBet password here.</p>
  <label for="endpoint">Ingest endpoint</label>
  <input id="endpoint" placeholder="https://your-service.up.railway.app/browser/events">
  <label for="token">Collector token</label>
  <input id="token" type="password" autocomplete="off">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
