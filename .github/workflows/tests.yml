name: Tests

on:
  push:
    branches:
      - browser-side-collector
      - v13-prir
      - main
  pull_request:
    branches:
      - browser-side-collector
      - v13-prir
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python
        run: python -m compileall -q aviator tools bot.py collector.py

      - name: Run tests
        run: pytest -q
